name: Feature request
description: Suggest a capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to test?
      description: Describe the integration scenario you cannot simulate today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: If you have a scenario YAML or CLI shape in mind, sketch it here.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
